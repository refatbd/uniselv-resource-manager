# UNISELV Resource Manager Admin
location ~ ^/uniselv-resman/(index.php)$ {
	fastcgi_pass unix:/usr/local/emps/var/fpm-root.sock;
	fastcgi_read_timeout 300;
	fastcgi_index index.php;
	fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
	fastcgi_param SCRIPT_NAME $fastcgi_script_name;
	include fastcgi_params;
}

location = /uniselv-resman/webhook.php {
	fastcgi_pass unix:/usr/local/emps/var/fpm-root.sock;
	fastcgi_read_timeout 65;
	client_max_body_size 24k;
	include fastcgi_params;
	fastcgi_param SCRIPT_FILENAME /usr/local/webuzo/plugins/uniselv-resman/webhook.php;
}
